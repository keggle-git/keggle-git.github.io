<style>
/* Layout: one study column; deck chips and settings above, a practice-paper card in the middle, a word list below */
:root {
  --paper: #f4f7f5;
  --surface: #ffffff;
  --ink: #18211e;
  --muted: #5a6964;
  --line: #d6dfdb;
  --accent: #1c6a56;
  --accent-ink: #ffffff;
  --accent-soft: #e2efe9;
  --grid: #e2a49c;
  --again: #a9442d;
  --again-soft: #f6e5e0;
  --f-hanzi-s: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --f-hanzi-t: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --f-serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111715; --surface: #18201d; --ink: #e6ece9; --muted: #98a7a1; --line: #2a3531;
    --accent: #62c3a3; --accent-ink: #0c1311; --accent-soft: #1d3029; --grid: #7a3f39;
    --again: #e88a73; --again-soft: #3a221d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111715; --surface: #18201d; --ink: #e6ece9; --muted: #98a7a1; --line: #2a3531;
  --accent: #62c3a3; --accent-ink: #0c1311; --accent-soft: #1d3029; --grid: #7a3f39;
  --again: #e88a73; --again-soft: #3a221d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 42rem; margin: 0 auto; padding-inline: 16px; padding-block: 1rem 3rem; display: flex; flex-direction: column; gap: 1rem; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
.eyebrow { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
h1 { margin: .1rem 0 0; font-family: var(--f-serif); font-weight: 600; font-size: 1.55rem; line-height: 1.15; text-wrap: balance; }
h1 .hz { font-family: var(--f-hanzi-s); font-weight: 500; margin-right: .35rem; }
.count { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { font: inherit; font-size: .85rem; padding: .35rem .7rem; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: inline-flex; gap: .35rem; align-items: baseline; }
.chip small { color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .8; }
.chip:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.settings { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; font-size: .82rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: .82rem; border: 0; background: none; color: var(--ink); padding: .3rem .6rem; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg .hzb { font-family: var(--f-hanzi-s); }
.seg .hzb.t { font-family: var(--f-hanzi-t); }
.toggle { display: inline-flex; align-items: center; gap: .35rem; cursor: pointer; }
.toggle input { accent-color: var(--accent); }
.linkbtn { font: inherit; font-size: .82rem; background: none; border: 0; color: var(--accent); cursor: pointer; padding: .3rem 0; text-decoration: underline; text-underline-offset: 3px; }

.progress { display: flex; align-items: center; gap: .6rem; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem 1rem 1rem; min-height: 21rem; display: flex; flex-direction: column; gap: 1rem; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.card-top { display: flex; justify-content: space-between; align-items: center; font-size: .75rem; color: var(--muted); }
.tag { letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
.tag .extra { margin-left: .4rem; padding: .05rem .4rem; border-radius: 4px; border: 1px solid var(--line); text-transform: none; letter-spacing: 0; }
.prompt { flex: 1; display: grid; place-items: center; min-height: 9rem; }
.big-text { font-family: var(--f-serif); font-size: clamp(1.6rem, 6vw, 2.4rem); text-align: center; text-wrap: balance; line-height: 1.2; }
.big-text.py { font-style: italic; }

.tiles { display: flex; justify-content: center; gap: .35rem; width: 100%; }
.tile { flex: 0 1 7.5rem; min-width: 0; aspect-ratio: 1; max-width: 100%; position: relative; border: 1.5px solid var(--grid); container-type: inline-size; display: grid; place-items: center; }
.tile::before, .tile::after { content: ""; position: absolute; border: 0 dashed var(--grid); }
.tile::before { left: 50%; top: 0; bottom: 0; border-left-width: 1px; }
.tile::after { top: 50%; left: 0; right: 0; border-top-width: 1px; }
.tile span { position: relative; z-index: 1; font-family: var(--f-hanzi-s); font-weight: 500; font-size: 74cqi; line-height: 1; }
.tiles.t .tile span { font-family: var(--f-hanzi-t); }
.tiles.small { justify-content: flex-start; }
.tiles.small .tile { flex-basis: 3.4rem; }
.tile.punct { border-color: transparent; }
.tile.punct::before, .tile.punct::after { display: none; }

.answer { border-top: 1px solid var(--line); padding-top: .9rem; display: grid; gap: .55rem; }
.answer .py { font-family: var(--f-serif); font-style: italic; font-size: 1.45rem; }
.answer .en { font-family: var(--f-serif); font-size: 1.15rem; }
.answer .alt { font-size: .85rem; color: var(--muted); }
.answer .alt b { font-family: var(--f-hanzi-t); font-weight: 500; color: var(--ink); font-size: 1.1rem; }
.answer .alt b.s { font-family: var(--f-hanzi-s); }
.ans-row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.speak { font: inherit; font-size: .8rem; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 999px; padding: .25rem .65rem; cursor: pointer; display: inline-flex; align-items: center; gap: .3rem; }
.speak svg { width: 14px; height: 14px; fill: currentColor; }
.hint { font-size: .8rem; color: var(--muted); text-align: center; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.btn { font: inherit; font-size: 1rem; font-weight: 600; padding: .8rem 1rem; border-radius: 10px; border: 1px solid transparent; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); grid-column: 1 / -1; }
.btn.good { background: var(--accent); color: var(--accent-ink); }
.btn.again { background: var(--again-soft); color: var(--again); border-color: var(--again); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn small { display: block; font-weight: 400; font-size: .72rem; opacity: .8; }
.keys { font-size: .75rem; color: var(--muted); text-align: center; }
@media (hover: none) { .keys { display: none; } }

.done { flex: 1; display: grid; place-items: center; text-align: center; gap: .4rem; cursor: default; }
.done h2 { font-family: var(--f-serif); font-weight: 600; margin: 0; font-size: 1.5rem; }
.done p { margin: 0; color: var(--muted); }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
summary { cursor: pointer; padding: .75rem 1rem; font-weight: 500; }
.list-wrap { overflow-x: auto; padding: 0 1rem 1rem; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
td, th { text-align: left; padding: .45rem .5rem; border-top: 1px solid var(--line); vertical-align: baseline; }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; border-top: 0; }
td.hz { font-family: var(--f-hanzi-s); font-size: 1.15rem; white-space: nowrap; }
td.hz .t { font-family: var(--f-hanzi-t); color: var(--muted); font-size: .95rem; margin-left: .3rem; }
td.py { font-family: var(--f-serif); font-style: italic; white-space: nowrap; }
td.k { color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.reset-row { display: flex; gap: .75rem; align-items: center; padding-top: .75rem; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">82-131 Elementary Chinese I</div>
      <h1><span class="hz">生词</span>Flashcards</h1>
    </div>
    <div class="count" id="count"></div>
  </header>

  <div class="chips" id="chips" role="group" aria-label="Lessons to study"></div>

  <div class="settings">
    <span>Show first
      <span class="seg" id="seg-front">
        <button type="button" data-v="char">Characters</button>
        <button type="button" data-v="pinyin">Pinyin</button>
        <button type="button" data-v="english">English</button>
      </span>
    </span>
    <span class="seg" id="seg-script" aria-label="Character set">
      <button type="button" data-v="s" class="hzb">简体</button>
      <button type="button" data-v="t" class="hzb t">繁體</button>
    </span>
    <label class="toggle"><input type="checkbox" id="extras"> Include extra words</label>
    <button type="button" class="linkbtn" id="restart">Shuffle and restart</button>
  </div>

  <div class="progress"><span id="prog-text"></span><div class="bar"><i id="prog-bar"></i></div></div>

  <div class="card" id="card" tabindex="0" aria-live="polite"></div>
  <div class="actions" id="actions"></div>
  <div class="keys">Space shows the answer · 1 again · 2 got it · S plays audio</div>

  <details id="list">
    <summary id="list-summary">Word list</summary>
    <div class="list-wrap">
      <table><thead><tr><th>Characters</th><th>Pinyin</th><th>Meaning</th><th>Known</th></tr></thead><tbody id="list-body"></tbody></table>
      <div class="reset-row">
        <span>Progress is saved in this browser only.</span>
        <button type="button" class="linkbtn" id="reset">Reset progress</button>
      </div>
    </div>
  </details>
</div>

<script>

  { id: "L1", name: "Lesson 1", cards: [

// When several decks are selected, a word that appears in more than one is shown once, from the first deck in this order
const PRIORITY = ["L1","L2","L3","L4","L5","L6","CE","PF","NUM","RAD"];

const store = {
  get(k, d) { try { const v = localStorage.getItem("zh-fc:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("zh-fc:" + k, JSON.stringify(v)); } catch (e) {} }
};
const prefs = Object.assign({ decks: ["L6"], front: "char", script: "s", extras: true }, store.get("prefs", {}));
let known = store.get("known", {});
const deckById = Object.fromEntries(DECKS.map(d => [d.id, d]));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let session = { queue: [], total: 0, done: 0, missed: [], current: null, revealed: false };

function cardObj(deck, a) { return { deck: deck.id, deckName: deck.name, s: a[0], t: a[1] || a[0], p: a[2], e: a[3], x: !!a[4], key: deck.id + "|" + a[0] }; }

function pool() {
  const seen = new Set(), out = [];
  for (const id of PRIORITY) {
    if (!prefs.decks.includes(id)) continue;
    for (const a of deckById[id].cards) {
      if (a[4] && !prefs.extras) continue;
      if (seen.has(a[0])) continue;
      seen.add(a[0]); out.push(cardObj(deckById[id], a));
    }
  }
  return out;
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function start(cards) {
  // Words you have marked known fewer times come up first, and core lesson words before extras
  const q = shuffle(cards.slice()).sort((a, b) => ((known[a.key] || 0) - (known[b.key] || 0)) || (a.x - b.x));
  session = { queue: q, total: q.length, done: 0, missed: [], current: null, revealed: false };
  next();
}

function next() {
  session.current = session.queue.shift() || null;
  session.revealed = false;
  render();
}

function again() {
  const c = session.current; if (!c) return;
  if (!session.missed.some(m => m.key === c.key)) session.missed.push(c);
  known[c.key] = 0; store.set("known", known);
  session.queue.splice(Math.min(4, session.queue.length), 0, c);
  next();
}

function gotIt() {
  const c = session.current; if (!c) return;
  known[c.key] = (known[c.key] || 0) + 1; store.set("known", known);
  session.done++;
  next();
}

function reveal() { if (session.current && !session.revealed) { session.revealed = true; render(); } }

function tiles(text, script, small) {
  const chars = Array.from(text);
  return `<div class="tiles${script === "t" ? " t" : ""}${small ? " small" : ""}">` +
    chars.map(ch => /[⺀-鿿\u{20000}-\u{2FFFF}]/u.test(ch)
      ? `<div class="tile"><span>${esc(ch)}</span></div>`
      : `<div class="tile punct"><span>${esc(ch)}</span></div>`).join("") + `</div>`;
}

const hasSpeech = "speechSynthesis" in window;
function speak(text) {
  if (!hasSpeech) return;
  try {
    const u = new SpeechSynthesisUtterance(text.replace(/…/g, ""));
    u.lang = "zh-CN"; u.rate = 0.8;
    const v = speechSynthesis.getVoices().find(v => /^zh[-_](CN|Hans)/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

function render() {
  const c = session.current, card = $("card"), actions = $("actions");
  const pct = session.total ? Math.round(100 * session.done / session.total) : 0;
  $("prog-text").textContent = session.total ? `${session.done} of ${session.total} learned` : "";
  $("prog-bar").style.width = pct + "%";

  if (!session.total) {
    card.innerHTML = `<div class="done"><div><h2>No words selected</h2><p>Pick one or more lessons above to start.</p></div></div>`;
    actions.innerHTML = ""; return;
  }
  if (!c) {
    const m = session.missed.length;
    card.innerHTML = `<div class="done"><div><h2>Done with this round</h2><p>${session.total} words · ${m ? m + " needed another look" : "every word on the first try"}</p></div></div>`;
    actions.innerHTML = (m ? `<button class="btn again" id="b-missed">Review the ${m} missed</button>` : "") +
      `<button class="btn ghost" id="b-restart"${m ? "" : ' style="grid-column:1/-1"'}>Study all again</button>`;
    if (m) $("b-missed").onclick = () => start(session.missed);
    $("b-restart").onclick = () => start(pool());
    return;
  }

  const hz = prefs.script === "t" ? c.t : c.s;
  let prompt;
  if (prefs.front === "char") prompt = tiles(hz, prefs.script);
  else if (prefs.front === "pinyin") prompt = `<div class="big-text py">${esc(c.p)}</div>`;
  else prompt = `<div class="big-text">${esc(c.e)}</div>`;

  let answer = "";
  if (session.revealed) {
    const other = prefs.script === "t" ? c.s : c.t;
    const otherLabel = prefs.script === "t" ? "Simplified" : "Traditional";
    answer = `<div class="answer">` +
      (prefs.front !== "char" ? tiles(hz, prefs.script, true) : "") +
      `<div class="ans-row">${prefs.front !== "pinyin" ? `<span class="py">${esc(c.p)}</span>` : ""}` +
      (hasSpeech ? `<button type="button" class="speak" id="b-speak">${speakerIcon} Listen</button>` : "") + `</div>` +
      (prefs.front !== "english" ? `<div class="en">${esc(c.e)}</div>` : "") +
      (other !== hz ? `<div class="alt">${otherLabel} <b class="${prefs.script === "t" ? "s" : ""}">${esc(other)}</b></div>` : "") +
      `</div>`;
  }
  card.innerHTML = `<div class="card-top"><span class="tag">${esc(c.deckName)}${c.x ? '<span class="extra">extra</span>' : ""}</span><span>${session.queue.length} left in queue</span></div>` +
    `<div class="prompt">${prompt}</div>` + (answer || `<div class="hint">Tap the card to show the answer</div>`);
  const sb = $("b-speak");
  if (sb) sb.onclick = ev => { ev.stopPropagation(); speak(c.s); };

  actions.innerHTML = session.revealed
    ? `<button class="btn again" id="b-again">Again<small>see it again soon</small></button><button class="btn good" id="b-good">Got it<small>next word</small></button>`
    : `<button class="btn primary" id="b-show">Show answer</button>`;
  if (session.revealed) { $("b-again").onclick = again; $("b-good").onclick = gotIt; }
  else $("b-show").onclick = reveal;
}

function renderChips() {
  const chips = $("chips");
  const allOn = DECKS.every(d => prefs.decks.includes(d.id));
  chips.innerHTML = `<button type="button" class="chip" data-id="ALL" aria-pressed="${allOn}">All</button>` +
    DECKS.map(d => {
      const n = d.cards.filter(a => prefs.extras || !a[4]).length;
      return `<button type="button" class="chip" data-id="${d.id}" aria-pressed="${prefs.decks.includes(d.id)}">${esc(d.name)} <small>${n}</small></button>`;
    }).join("");
}

function renderList() {
  const cards = pool();
  $("count").textContent = `${cards.length} words selected`;
  $("list-summary").textContent = `Word list (${cards.length})`;
  $("list-body").innerHTML = cards.map(c => {
    const k = known[c.key] || 0;
    return `<tr><td class="hz">${esc(c.s)}${c.t !== c.s ? `<span class="t">${esc(c.t)}</span>` : ""}</td><td class="py">${esc(c.p)}</td><td>${esc(c.e)}</td><td class="k">${k ? "✓".repeat(Math.min(k, 3)) : ""}</td></tr>`;
  }).join("");
}

function renderSegs() {
  for (const [id, key] of [["seg-front", "front"], ["seg-script", "script"]])
    for (const b of $(id).querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.v === prefs[key]));
  $("extras").checked = prefs.extras;
}

function savePrefs() { store.set("prefs", prefs); }
function refreshAll(restart) { renderChips(); renderSegs(); renderList(); if (restart) start(pool()); else render(); }

$("chips").addEventListener("click", ev => {
  const b = ev.target.closest(".chip"); if (!b) return;
  const id = b.dataset.id;
  if (id === "ALL") prefs.decks = DECKS.every(d => prefs.decks.includes(d.id)) ? [] : DECKS.map(d => d.id);
  else prefs.decks = prefs.decks.includes(id) ? prefs.decks.filter(x => x !== id) : prefs.decks.concat(id);
  savePrefs(); refreshAll(true);
});
for (const [id, key] of [["seg-front", "front"], ["seg-script", "script"]])
  $(id).addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return;
    prefs[key] = b.dataset.v; savePrefs(); renderSegs(); render();
  });
$("extras").addEventListener("change", ev => { prefs.extras = ev.target.checked; savePrefs(); refreshAll(true); });
$("restart").addEventListener("click", () => start(pool()));
$("card").addEventListener("click", reveal);

let resetArmed = false;
$("reset").addEventListener("click", () => {
  if (!resetArmed) { resetArmed = true; $("reset").textContent = "Tap again to erase all progress"; setTimeout(() => { resetArmed = false; $("reset").textContent = "Reset progress"; }, 4000); return; }
  known = {}; store.set("known", known); resetArmed = false; $("reset").textContent = "Reset progress"; refreshAll(true);
});

document.addEventListener("keydown", ev => {
  if (ev.target.closest && ev.target.closest("input, summary")) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === " " || k === "enter") { if (ev.target.tagName === "BUTTON") return; ev.preventDefault(); if (!session.revealed) reveal(); else gotIt(); }
  else if (k === "1" || k === "j") { if (session.revealed) again(); }
  else if (k === "2" || k === "k") { if (session.revealed) gotIt(); }
  else if (k === "s" && session.current) speak(session.current.s);
});
if (hasSpeech) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) {} }

refreshAll(true);
</script>

</body>
</html>
